name: Live Application Verification Check

on:
  workflow_call:
    inputs:
      target_ip:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  post-deploy-check:
    runs-on: ubuntu-latest
    environment: development

    steps:
    # --- STEP 1: INITIAL LOG VALIDATION ---
    - name: Initialization Notice
      run: |
        echo "=== Launching App Verification Engine ==="
        echo "Target Validation IP Endpoint: \${{ inputs.target_ip }}"

    # --- STEP 2: BULLETPROOF FLAT CURL VERIFICATION STEP ---
    - name: Live HTTP Endpoint Verification
      run: |
        echo "=== Launching Automated HTTP Validation Loop ==="
        
        # 1. We test attempt 1 immediately. If it passes, the step completes successfully.
        echo "Attempt 1/3: Pinging service..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}"; then
          echo "✅ Validation successful! Application container is live."
          exit 0
        fi
        
        echo "Waiting 15 seconds before retry..."
        sleep 15
        
        # 2. Test attempt 2
        echo "Attempt 2/3: Pinging service..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}"; then
          echo "✅ Validation successful! Application container is live."
          exit 0
        fi
        
        echo "Waiting 15 seconds before retry..."
        sleep 15
        
        # 3. Test attempt 3. If this fails, the step throws an error code natively to protect the pipeline.
        echo "Attempt 3/3: Pinging service..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}"; then
          echo "✅ Validation successful! Application container is live."
          exit 0
        fi
        
        echo "❌ VALIDATION FAILED: Server failed to return a successful 200 OK code within the time window."
        exit 1

    # --- STEP 3: CREATE THE VISUAL DASHBOARD SUMMARY ---
    - name: Generate Clickable Deployment Dashboard Summary
      if: always()
      run: |
        echo "### 🚀 Production Deployment Live Verification" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> \$GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Target Server IP** | \`${{ inputs.target_ip }}\` |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Environment** | \`development\` |" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "---" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "#### 🔗 Visual Verification Gateway:" >> \$GITHUB_STEP_SUMMARY
        echo "## [👉 Open Application Live Dashboard (HTTP)](http://${{ inputs.target_ip }})" >> \$GITHUB_STEP_SUMMARY
