name: Live Application Verification Check

on:
  workflow_call:
    inputs:
      target_ip:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  post-deploy-check:
    runs-on: ubuntu-latest
    environment: development

    steps:
    - name: Initialization Notice
      run: |
        echo "=== Launching App Verification Engine ==="
        echo "Received Input Target IP: \${{ inputs.target_ip }}"

    # --- FIXED: Simplified loop layout with built-in character cleaning ---
    - name: Live HTTP Endpoint Verification
      run: |
        echo "=== Launching Automated HTTP Validation Loop ==="
        
        # Safely scrub out any rogue backslashes from the incoming text string
        CLEAN_IP=(echo "{{ inputs.target_ip }}" | tr -d '\\')
        TARGET_URL="http://\$CLEAN_IP"
        echo "Sanitized Target Verification Endpoint: \$TARGET_URL"
        
        # Hardened loop using simple space separation to avoid shell syntax errors
        for i in 1 2 3 4 5 6; do
          echo "Attempt i/6: Pinging service at TARGET_URL ..."
          
          # Perform a clean curl check pulling only the three digit HTTP status code
          HTTP_STATUS=\((curl -s -o /dev/null -w "\%{http_code}" --connect-timeout 5 "\)TARGET_URL") || HTTP_STATUS=0
          echo "Received HTTP Server Status Code: \$HTTP_STATUS"
          
          if [ "\$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Validation successful! Application container is live."
            exit 0
          fi
          
          echo "Waiting 10 seconds before next retry..."
          sleep 10
        done
        
        echo "❌ Validation failed: Server failed to return a valid status code."
        exit 1

    - name: Generate Clickable Deployment Dashboard Summary
      if: always()
      run: |
        CLEAN_IP=(echo "{{ inputs.target_ip }}" | tr -d '\\')
        echo "### 🚀 Production Deployment Live Verification" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> \$GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Target Server IP** | \`$CLEAN_IP\` |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Environment** | \`development\` |" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "---" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "#### 🔗 Visual Verification Gateway:" >> \$GITHUB_STEP_SUMMARY
        echo "## [👉 Open Application Live Dashboard (HTTP)](http://$CLEAN_IP)" >> \$GITHUB_STEP_SUMMARY
