name: Live Application Verification Check

on:
  workflow_call:
    inputs:
      target_ip:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  post-deploy-check:
    runs-on: ubuntu-latest
    environment: development

    steps:
    # --- STEP 1: INITIAL LOG VALIDATION ---
    - name: Initialization Notice
      run: |
        echo "=== Launching App Verification Engine ==="
        echo "Triggered by completed parent deployment pipeline execution."

    # --- STEP 2: NATIVE NODE.JS HTTP POLLING GATEWAY ---
    - name: Live HTTP Endpoint Verification
      uses: actions/actions-javascript-action@main
      with:
        run: |
          const http = require('http');
          
          // Scrub any residual rogue formatting backslashes out of the input IP string parameters cleanly
          const rawIp = "\${{ inputs.target_ip }}";
          const cleanIp = rawIp.replace(/\\/g, "").trim();
          const targetUrl = `http://${cleanIp}`;
          
          console.log(`Target URL Endpoint: ${targetUrl}`);
          
          let attempts = 0;
          const maxAttempts = 6;
          
          function pingService() {
            attempts++;
            console.log(`Attempt ${attempts}/${maxAttempts}: Pinging service...`);
            
            const req = http.get(targetUrl, (res) => {
              console.log(`Received HTTP Server Status Code: ${res.statusCode}`);
              if (res.statusCode === 200) {
                console.log("✅ VALIDATION SUCCESSFUL: Application container is live on port 80!");
                process.exit(0);
              }
              retryOrFail();
            });
            
            req.on('error', (err) => {
              console.log(`Connection attempt failed due to network latency: ${err.message}`);
              retryOrFail();
            });
            
            req.setTimeout(5000, () => {
              console.log("Connection timed out after 5 seconds.");
              req.destroy();
            });
          }
          
          function retryOrFail() {
            if (attempts >= maxAttempts) {
              console.log("❌ VALIDATION FAILED: Application failed to return 200 OK within the window.");
              process.exit(1);
            }
            console.log("Waiting 10 seconds before next retry...");
            setTimeout(pingService, 10000);
          }
          
          pingService();

    # --- STEP 3: CONSOLIDATED VISUAL MARKDOWN OVERVIEW GATEWAY ---
    - name: Generate Clickable Deployment Dashboard Summary
      if: always()
      run: |
        # Strip backslashes cleanly using simple bash variable parameter expansion rules
        RAW_IP="\${{ inputs.target_ip }}"
        CLEAN_IP=\${RAW_IP//\\/}
        
        echo "### 🚀 Production Deployment Live Verification" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> \$GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Target Server IP** | \`$CLEAN_IP\` |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Environment** | \`development\` |" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "---" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "#### 🔗 Visual Verification Gateway:" >> \$GITHUB_STEP_SUMMARY
        echo "## [👉 Open Application Live Dashboard (HTTP)](http://$CLEAN_IP)" >> \$GITHUB_STEP_SUMMARY
