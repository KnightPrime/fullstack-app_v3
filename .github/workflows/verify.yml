name: Live Application Verification Check

on:
  workflow_call:
    inputs:
      target_ip:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  post-deploy-check:
    runs-on: ubuntu-latest
    environment: development

    steps:
    # --- STEP 1: INITIAL LOG VALIDATION ---
    - name: Initialization Notice
      run: |
        echo "=== Launching App Verification Engine ==="
        echo "Target Validation IP Endpoint: \${{ inputs.target_ip }}"

    # --- STEP 2: EXTENDED API ENDPOINT HEALTH VALIDATION RETRY LOOP ---
    - name: Live HTTP Endpoint Verification
      run: |
        echo "=== Launching Automated HTTP Validation Loop ==="
        
        # 1. Attempt 1
        echo "Attempt 1/6: Pinging backend API health check..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}/api/hello"; then
          echo "✅ Validation successful! Backend container API is live."
          exit 0
        fi
        echo "Waiting 10 seconds before retry..."
        sleep 10
        
        # 2. Attempt 2
        echo "Attempt 2/6: Pinging backend API health check..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}/api/hello"; then
          echo "✅ Validation successful! Backend container API is live."
          exit 0
        fi
        echo "Waiting 10 seconds before retry..."
        sleep 10
        
        # 3. Attempt 3
        echo "Attempt 3/6: Pinging backend API health check..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}/api/hello"; then
          echo "✅ Validation successful! Backend container API is live."
          exit 0
        fi
        echo "Waiting 10 seconds before retry..."
        sleep 10

        # 4. Attempt 4
        echo "Attempt 4/6: Pinging backend API health check..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}/api/hello"; then
          echo "✅ Validation successful! Backend container API is live."
          exit 0
        fi
        echo "Waiting 10 seconds before retry..."
        sleep 10

        # 5. Attempt 5
        echo "Attempt 5/6: Pinging backend API health check..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}/api/hello"; then
          echo "✅ Validation successful! Backend container API is live."
          exit 0
        fi
        echo "Waiting 10 seconds before retry..."
        sleep 10

        # 6. Attempt 6 (Final check)
        echo "Attempt 6/6: Pinging backend API health check..."
        if curl -s -f -o /dev/null --connect-timeout 5 "http://\${{ inputs.target_ip }}/api/hello"; then
          echo "✅ Validation successful! Backend container API is live."
          exit 0
        fi
        
        echo "❌ VALIDATION FAILED: Server failed to return a successful 200 OK code from /api/hello within 60 seconds."
        echo "Please check your NGINX proxy pass configurations or container runtime status logs."
        exit 1

    # --- STEP 3: CREATE THE VISUAL DASHBOARD SUMMARY ---
    - name: Generate Clickable Deployment Dashboard Summary
      if: always()
      run: |
        echo "### 🚀 Production Deployment Live Verification" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> \$GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Target Server IP** | \`${{ inputs.target_ip }}\` |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Environment** | \`development\` |" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "---" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "#### 🔗 Visual Verification Gateway:" >> \$GITHUB_STEP_SUMMARY
        echo "## [👉 Open Application Live Dashboard (HTTP)](http://${{ inputs.target_ip }})" >> \$GITHUB_STEP_SUMMARY
