name: Live Application Verification Check

on:
  workflow_call:
    inputs:
      target_ip:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  post-deploy-check:
    runs-on: ubuntu-latest
    environment: development

    steps:
    # --- STEP 1: INITIAL LOG VALIDATION ---
    - name: Initialization Notice
      run: |
        echo "=== Launching App Verification Engine ==="
        echo "Target Validation IP Endpoint: \${{ inputs.target_ip }}"

    # --- STEP 2: FIXED AUTOMATED HTTP VALIDATION RETRY LOOP ---
    - name: Live HTTP Endpoint Verification
      run: |
        echo "=== Launching Automated HTTP Validation Loop ==="
        TARGET_URL="http://\${{ inputs.target_ip }}"
        
        # Hardened sequential verification loop using a clean, standard spacing array format
        for i in 1 2 3 4 5 6; do
          echo "Attempt \(i/6: Pinging service at\)TARGET_URL ..."
          
          # FIXED: Clean, standard command substitution syntax with zero backslash formatting conflicts
          HTTP_STATUS=\((curl -s -o /dev/null -w "\%{http_code}" --connect-timeout 5 "\)TARGET_URL") || HTTP_STATUS=0
          echo "Received HTTP Server Status Code: \$HTTP_STATUS"
          
          if [ "\$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Validation successful! Application container is live."
            exit 0
          fi
          
          echo "Waiting 10 seconds before next retry..."
          sleep 10
        done
        
        echo "❌ Validation failed: Server failed to return a valid response code."
        exit 1

    # --- STEP 3: CONSOLIDATED VISUAL MARKDOWN OVERVIEW GATEWAY ---
    - name: Generate Clickable Deployment Dashboard Summary
      if: always()
      run: |
        echo "### 🚀 Production Deployment Live Verification" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> \$GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Target Server IP** | \`${{ inputs.target_ip }}\` |" >> \$GITHUB_STEP_SUMMARY
        echo "| **Environment** | \`development\` |" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "---" >> \$GITHUB_STEP_SUMMARY
        echo "" >> \$GITHUB_STEP_SUMMARY
        echo "#### 🔗 Visual Verification Gateway:" >> \$GITHUB_STEP_SUMMARY
        echo "## [👉 Open Application Live Dashboard (HTTP)](http://${{ inputs.target_ip }})" >> \$GITHUB_STEP_SUMMARY
