name: Destroy Infrastructure (Cleanup)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: '🌍 Select Target Environment to Destroy'
        required: true
        type: choice
        options:
          - development # UPDATED: Matches your new sandbox branch naming track
          - Production
        default: 'development'
      purge_s3_bucket:
        description: '⚠️ FORCE PURGE ENTRIES? (Type YES to wipe the S3 bucket context completely from AWS)'
        required: false
        default: 'NO'

jobs:
  teardown:
    runs-on: ubuntu-latest
    # Dynamically maps back to your GitHub Staging Sandbox or Production environments panel profiles
    environment: ${{ github.event.inputs.target_env }} 

    env:
      STATE_BUCKET_NAME: "knightprime-gitops-state-bucket-2026"
      AWS_REGION: "us-east-1"
      #SELECTED_ENV: ${{ github.event.inputs.target_env == 'development' || 'Production' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS CLI Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    # --- STEP 1: INITIALIZE SHARED BACKEND STATE MAPS ---
    - name: Terraform Init
      working-directory: ./terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}" \
          -backend-config="key=state/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

   # --- STEP 2: FIXED WORKSPACE PARTITION DYNAMIC MAPPING LOOP ---
    - name: Switch to Target Infrastructure Workspace
      working-directory: ./terraform
      run: |
        # 1. Native robust shell evaluation mapping to match your Git branches safely
        if [ "${{ github.event.inputs.target_env }}" = "staging-sandbox" ]; then
          REAL_WORKSPACE="staging"
        else
          REAL_WORKSPACE="production"
        fi
        
        echo "=== Activating Workspace State Partition: $REAL_WORKSPACE ==="
        echo "RESOLVED_ENV=$REAL_WORKSPACE" >> $GITHUB_ENV
        
        # 2. Select or create the workspace partition cleanly via command parameters
        terraform workspace select "$REAL_WORKSPACE" || terraform workspace new "$REAL_WORKSPACE" 

    # --- STEP 3: DECLARATIVE ISOLATED INFRASTRUCTURE TEARDOWN ---
    - name: Terraform Destroy
      working-directory: ./terraform
      run: |
        # Pulls the environment context safely out of the workflow environment environment files
        terraform workspace select "${{ env.RESOLVED_ENV }}"
        terraform destroy -auto-approve \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"

    # --- STEP 4: BULLETPROOF METADATA STREAMING VERSIONED S3 PURGE LAYER ---
    - name: Post-Teardown Persistent S3 Bucket Removal
      if: always() && github.event.inputs.purge_s3_bucket == 'YES'
      run: |
        echo "=== ⚠️ CRITICAL OVERRIDE ACTIVATED: Wiping Versioned State Bucket ==="
        BUCKET="${{ env.STATE_BUCKET_NAME }}"
        
        aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Suspended
        
        echo "1. Streaming and deleting all hidden object version slices..."
        aws s3api list-object-versions --bucket "$BUCKET" --output json | \
        jq -c '.Versions[]?' | while read -r version; do
          KEY=$(echo "$version" | jq -r '.Key')
          VERSION_ID=$(echo "$version" | jq -r '.VersionId')
          echo "Removing key: $KEY (Version: $VERSION_ID)"
          aws s3api delete-object --bucket "$BUCKET" --key "$KEY" --version-id "$VERSION_ID" >/dev/null 2>&1 || true
        done
        
        echo "2. Streaming and deleting all lingering delete markers..."
        aws s3api list-object-versions --bucket "$BUCKET" --output json | \
        jq -c '.DeleteMarkers[]?' | while read -r marker; do
          KEY=$(echo "$marker" | jq -r '.Key')
          VERSION_ID=$(echo "$marker" | jq -r '.VersionId')
          echo "Removing delete marker for key: $KEY (Version: $VERSION_ID)"
          aws s3api delete-object --bucket "$BUCKET" --key "$KEY" --version-id "$VERSION_ID" >/dev/null 2>&1 || true
        done
        
        echo "3. Executing final removal of the completely empty S3 bucket structure..."
        aws s3 rb s3://"$BUCKET" --force
        echo "✅ SUCCESS: The versioned S3 State Bucket has been completely scrubbed from AWS."
