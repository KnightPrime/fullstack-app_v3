name: Destroy Infrastructure (Cleanup)

on:
  workflow_dispatch:
    inputs:
      purge_s3_bucket:
        description: '⚠️ FORCE PURGE S3 STATE BUCKET? (Type YES to completely wipe the S3 bucket from AWS)'
        required: false
        default: 'NO'

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: development

    env:
      STATE_BUCKET_NAME: "knightprime-gitops-state-bucket-2026"
      AWS_REGION: "us-east-1"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS CLI Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    # --- STEP 1: INITIALIZE SHARED BACKEND CACHE MAPS ---
    - name: Terraform Init
      working-directory: ./terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}" \
          -backend-config="key=state/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

    # --- STEP 2: SAFE COMPUTE INFRASTRUCTURE TEARDOWN ---
    - name: Terraform Destroy
      working-directory: ./terraform
      run: |
        terraform destroy -auto-approve \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"

    # --- STEP 3: ADVANCED VERSIONED S3 BUCKET PURGE LAYER ---
    - name: Post-Teardown Persistent S3 Bucket Removal
      if: always() && github.event.inputs.purge_s3_bucket == 'YES'
      run: |
        echo "=== ⚠️ CRITICAL OVERRIDE ACTIVATED: Wiping Versioned State Bucket ==="
        BUCKET="${{ env.STATE_BUCKET_NAME }}"
        
        echo "1. Querying and removing all hidden object versions..."
        aws s3api list-object-versions --bucket "$BUCKET" --output json --query 'Versions[].{Key:Key,VersionId:VersionId}' > /tmp/versions.json
        if [ "$(cat /tmp/versions.json)" != "null" ] && [ -s /tmp/versions.json ]; then
          aws s3api delete-objects --bucket "$BUCKET" --delete "$(jq '{Objects: .}' /tmp/versions.json)" || true
        fi
        
        echo "2. Querying and removing all remaining delete markers..."
        aws s3api list-object-versions --bucket "$BUCKET" --output json --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' > /tmp/delete_markers.json
        if [ "$(cat /tmp/delete_markers.json)" != "null" ] && [ -s /tmp/delete_markers.json ]; then
          aws s3api delete-objects --bucket "$BUCKET" --delete "$(jq '{Objects: .}' /tmp/delete_markers.json)" || true
        fi
        
        echo "3. Executing final removal of the completely empty S3 bucket structure..."
        aws s3 rb s3://"$BUCKET" --force
        echo "✅ SUCCESS: The versioned S3 State Bucket has been completely scrubbed from AWS."
