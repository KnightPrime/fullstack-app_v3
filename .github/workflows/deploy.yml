name: Complete Zero-Dependency GitOps Pipeline

on:
  pull_request:
    branches: [ main, docker ]
  push:
    branches: [ main, docker ]

jobs:
  infra-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    env:
      # CHOOSE A GLOBALLY UNIQUE NAME FOR YOUR TERRAFORM STATE BUCKET
      STATE_BUCKET_NAME: "knightprime-gitops-state-bucket-2026"
      AWS_REGION: "us-east-1"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- STEP 1: CONFIGURE AWS CLI CREDENTIALS ---
    - name: Configure AWS CLI Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # --- STEP 2: AUTOMATICALLY VERIFY OR CREATE THE S3 STATE BUCKET ---
    - name: Bootstrap S3 State Bucket
      run: |
        echo "Checking if S3 Bucket '${{ env.STATE_BUCKET_NAME }}' exists..."
        if aws s3api head-bucket --bucket "${{ env.STATE_BUCKET_NAME }}" 2>/dev/null; then
          echo "Bucket already exists. Proceeding..."
        else
          echo "Bucket not found. Creating fresh S3 state architecture bucket..."
          aws s3api create-bucket \
            --bucket "${{ env.STATE_BUCKET_NAME }}" \
            --region "${{ env.AWS_REGION }}"
            
          echo "Enabling bucket versioning for safety rollbacks..."
          aws s3api put-bucket-versioning \
            --bucket "${{ env.STATE_BUCKET_NAME }}" \
            --versioning-configuration Status=Enabled
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    # --- STEP 3: DYNAMICALLY INITIALIZE BACKEND USING PARTIAL CONFIGS ---
    - name: Terraform Init (Dynamic S3 Backend Connection)
      working-directory: ./terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}" \
          -backend-config="key=state/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

    # --- STEP 4: DRY RUN PREVIEW ON PR ---
    - name: Terraform Plan (PR Validation)
      if: github.event_name == 'pull_request'
      working-directory: ./terraform
      run: |
        terraform plan \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"

    # --- STEP 5: RUN PRODUCTION REBUILD ON PUSH ---
    - name: Terraform Apply (Infrastructure Provisioning)
      if: github.event_name == 'push'
      working-directory: ./terraform
      run: |
        terraform apply -auto-approve \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"

    # --- STEP 6: EXTRACT NETWORKS ---
    - name: Fetch Dynamic Infrastructure Parameters
      if: github.event_name == 'push'
      id: infra-vars
      working-directory: ./terraform
      run: |
        EC2_IP=$(terraform output -raw app_public_ip)
        echo "EC2_PUBLIC_IP=$EC2_IP" >> $GITHUB_ENV
        
        echo "EC2_SSH_KEY<<EOF" >> $GITHUB_ENV
        terraform output -raw ec2_private_key >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    # --- STEP 7: COMPILE & DEPLOY CONTAINER ASSETS ---
    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest

    - name: Rollout Application to Live Instance
      if: github.event_name == 'push'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_PUBLIC_IP }}
        username: ubuntu
        key: ${{ env.EC2_SSH_KEY }}
        script: |
          until sudo docker info >/dev/null 2>&1; do echo "Waiting for Docker Engine initialization..."; sleep 5; done
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
          sudo docker stop app-runtime 2>/dev/null || true
          sudo docker rm app-runtime 2>/dev/null || true
          sudo docker run -d --name app-runtime --restart always -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest

