name: Complete Zero-Dependency GitOps Pipeline

on:
  pull_request:
    branches: [ Dockerhub ]
  push:
    branches: [ Dockerhub ]

jobs:
  # --- NEW: INITIAL AUTOMATED GUARDRAIL JOB (Spins up first) ---
  validate-code-tests:
    uses: ./.github/workflows/test.yml # Local reusable file hook without trailing branch tags

  # --- MODIFIED DEPLOYMENT JOB: Only executes if tests go green ---
  infra-and-deploy:
    needs: validate-code-tests # CRITICAL FENCE: Blocks deployment if code testing fails
    runs-on: ubuntu-latest
    environment: development

    env:
      # CHOOSE A GLOBALLY UNIQUE NAME FOR YOUR TERRAFORM STATE BUCKET
      STATE_BUCKET_NAME: "knightprime-gitops-state-bucket-2026"
      AWS_REGION: "us-east-1"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- STEP 1: CONFIGURE AWS CLI CREDENTIALS ---
    - name: Configure AWS CLI Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # --- STEP 2: AUTOMATICALLY VERIFY OR CREATE THE S3 STATE BUCKET ---
    - name: Bootstrap S3 State Bucket
      run: |
        echo "Checking if S3 Bucket '${{ env.STATE_BUCKET_NAME }}' exists..."
        if aws s3api head-bucket --bucket "${{ env.STATE_BUCKET_NAME }}" 2>/dev/null; then
          echo "Bucket already exists. Proceeding..."
        else
          echo "Bucket not found. Creating fresh S3 state architecture bucket..."
          aws s3api create-bucket \
            --bucket "${{ env.STATE_BUCKET_NAME }}" \
            --region "${{ env.AWS_REGION }}"
            
          echo "Enabling bucket versioning for safety rollbacks..."
          aws s3api put-bucket-versioning \
            --bucket "${{ env.STATE_BUCKET_NAME }}" \
            --versioning-configuration Status=Enabled
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    # --- STEP 3: DYNAMICALLY INITIALIZE BACKEND USING PARTIAL CONFIGS ---
    - name: Terraform Init (Dynamic S3 Backend Connection)
      working-directory: ./terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}" \
          -backend-config="key=state/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

    # --- STEP 4: DRY RUN PREVIEW ON PR ---
    - name: Terraform Plan (PR Validation)
      if: github.event_name == 'pull_request'
      working-directory: ./terraform
      run: |
        terraform plan \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"

    # --- NEW: PRACTICAL DRIFT AND REBUILD CHECK ---
    - name: Determine If Infrastructure Rebuild Is Required
      id: check-infra
      if: github.event_name == 'push'
      working-directory: ./terraform
      run: |
        # Run plan with detailed exitcode. '|| tr' prevents the script from crashing when changes are found.
        terraform plan -detailed-exitcode -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" > /dev/null 2>&1 && EXIT_CODE=$? || EXIT_CODE=$?
        echo "Terraform Exit Code evaluated to: $EXIT_CODE"
        
        if [ $EXIT_CODE -eq 0 ]; then
          echo "INFRA_CHANGED=false" >> $GITHUB_ENV
          echo "✅ No infrastructure modifications required. Keeping hardware as-is."
        else
          echo "INFRA_CHANGED=true" >> $GITHUB_ENV
          echo "⚠️ Infrastructure drift or structural updates detected. Processing configuration changes..."
        fi

    # --- STEP 5: RUN APPLY ONLY IF STRUCTURAL CHANGES EXIST ---
    - name: Terraform Apply (Conditional Infrastructure Provisioning)
      if: github.event_name == 'push' && env.INFRA_CHANGED == 'true'
      working-directory: ./terraform
      run: |
        terraform apply -auto-approve \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          
    # --- STEP 6: ALWAYS EXTRACT NETWORKS FOR THE APPLICATION CONTAINER ---
    - name: Fetch Dynamic Infrastructure Parameters
      if: github.event_name == 'push'
      id: infra-vars
      working-directory: ./terraform
      run: |
        EC2_IP=$(terraform output -raw app_public_ip)
        echo "EC2_PUBLIC_IP=$EC2_IP" >> $GITHUB_ENV
        
        echo "EC2_SSH_KEY<<EOF" >> $GITHUB_ENV
        terraform output -raw ec2_private_key >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
  # --- HYBRID OPTIMIZATION: SETUP DOCKER BUILDX CAPABILITIES ---
    - name: Set up Docker Buildx
      if: github.event_name == 'push'
      uses: docker/setup-buildx-action@v3
 
 # --- STEP 7: DOCKER HUB REGISTRY AUTHENTICATION ---
    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # --- STEP 8: BUILD & LAYER COMPILED IMAGES ---
    - name: Build and Push Docker Image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:sha-${{ github.sha }} #Added one more tag to implement two tags per pushed build image system
# FIXED: Virtual cache registry hooks drop sequential compilation latency below 30s
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # --- STEP 9: PRODUCTION CONTAINER SWAP ---
    - name: Rollout Application to Live Instance (Zero-Downtime Hot-Swap)
      if: github.event_name == 'push'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_PUBLIC_IP }}
        username: ubuntu
        key: ${{ env.EC2_SSH_KEY }}
        script: |
          until sudo docker info >/dev/null 2>&1; do echo "Waiting for Docker Engine initialization..."; sleep 5; done
          
          echo "=== 📊 RESOURCE CHECK: Before Deployment Swap ==="
          free -h
          
          echo "=== Executing Zero-Downtime In-Place Rollout ==="
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
          
          
          # 1. Determine active running production slot definitions dynamically
          if sudo docker ps --format '{{.Names}}' | grep -q "app-runtime-blue"; then
            TARGET_SLOT="green"
            OLD_SLOT="blue"
            TARGET_PORT="8080"
            OLD_PORT="80"
          else
            TARGET_SLOT="blue"
            OLD_SLOT="green"
            TARGET_PORT="80"
            OLD_PORT="8080"
          fi
          
          echo "Active container found on slot: $OLD_SLOT. Provisioning update on slot: $TARGET_SLOT ($TARGET_PORT)..."
          
          # 2. Clear old historical container remnants of the target slot if any exist
          sudo docker stop app-runtime-$TARGET_SLOT 2>/dev/null || true
          sudo docker rm app-runtime-$TARGET_SLOT 2>/dev/null || true
          
          # 3. Boot the updated image parallel container without disconnecting active traffic
          sudo docker run -d \
            --name app-runtime-$TARGET_SLOT \
            --restart always \
            -p $TARGET_PORT:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
          
          echo "=== 📊 RESOURCE CHECK: Peak Parallel Execution (Both Containers Live) ==="
          free -h
          sudo docker stats --no-stream

          # 4. Internal Localhost Health Check Loop targeting the isolated new environment slot
          echo "=== Starting Internal Localhost Health Check Loop ==="
          VALID=false
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i/6: Checking container slot $TARGET_SLOT on port $TARGET_PORT..."
            if curl -s -o /dev/null -w "%{http_code}" "http://localhost:$TARGET_PORT/api/hello" | grep -q "200"; then
              echo "✅ SUCCESS: Internal container slot $TARGET_SLOT responded with 200 OK!"
              VALID=true
              break
            fi
            sleep 10
          done
          
          if [ "$VALID" = false ]; then
            echo "❌ ERROR: New deployment slot failed health checks. Aborting hot-swap rollout."
            sudo docker stop app-runtime-$TARGET_SLOT 2>/dev/null || true
            exit 1
          fi
          
          # 5. Hot-swap complete: Safely dismantle the legacy code environment block
          echo "Dynamic handshake complete. Gracefully decommissioned legacy environment slot: app-runtime-$OLD_SLOT"
          sudo docker stop app-runtime-$OLD_SLOT 2>/dev/null || true
          sudo docker rm app-runtime-$OLD_SLOT 2>/dev/null || true
          
          # 6. Ensure default routing port mapping alignment matches standard web traffic layers
          if [ "$TARGET_SLOT" = "green" ]; then
             echo "Traffic successfully routed via rolling ports. Realignment complete."
          fi

        # --- FIXED: Exports the variable purely as text with no formatting characters ---
    outputs:
      ec2_public_ip: ${{ env.EC2_PUBLIC_IP }}

  # --- CALL THE REUSABLE VERIFICATION WORKFLOW ---
  trigger-verification:
    needs: infra-and-deploy
    uses: ./.github/workflows/verify.yml
    with:
      target_ip: ${{ needs.infra-and-deploy.outputs.ec2_public_ip }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


  
