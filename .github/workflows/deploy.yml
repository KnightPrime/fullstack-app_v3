name: Complete Zero-Dependency GitOps Pipeline

on:
  pull_request:
    branches: [ Dockerhub ]
  push:
    branches: [ Dockerhub ]

jobs:
  infra-and-deploy:
    runs-on: ubuntu-latest

    #steps:
    #- name: Checkout Code
    #  uses: actions/checkout@v4

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- ADD THIS TEMPORARY VALIDATOR STEP ---
    - name: Sanity Check GitHub Secret Injection
      env:
        CHECK_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        CHECK_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY_ID}}
      run: |
        echo "=== Debugging Secrets Resolution ==="
        echo "AWS_ACCESS_KEY_ID length is: ${#CHECK_ID} characters"
        echo "AWS_SECRET_ACCESS_KEY length is: ${#CHECK_SECRET} characters"
        if [ ${#CHECK_ID} -eq 0 ] || [ ${#CHECK_SECRET} -eq 0 ]; then
          echo "ERROR: GitHub is passing EMPTY strings! Double check your Repository Secrets panel."
          exit 1
        fi


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

        # --- STEP 3: DRY RUN PREVIEW ON PR ---
    - name: Terraform Plan (PR Validation)
      if: github.event_name == 'pull_request'
      working-directory: ./terraform
      run: |
        terraform plan \
          -var="aws_access_key=YOUR_ACTUAL_AWS_ACCESS_KEY_ID" \
          -var="aws_secret_key=YOUR_ACTUAL_AWS_SECRET_ACCESS_KEY"

    # --- STEP 4: HARD APPLY ON PUSH/MERGE ---
    - name: Terraform Apply (Infrastructure Provisioning)
      if: github.event_name == 'push'
      working-directory: ./terraform
      run: |
        terraform apply -auto-approve \
          -var="aws_access_key=AKIA2YUVZVEGKF53ZURN" \
          -var="aws_secret_key=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"

    # --- STEP 5: EXTRACT DYNAMIC PARAMETERS ---
    - name: Fetch Dynamic Infrastructure Parameters
      if: github.event_name == 'push'
      id: infra-vars
      working-directory: ./terraform
      run: |
        EC2_IP=$(terraform output -raw app_public_ip)
        echo "EC2_PUBLIC_IP=$EC2_IP" >> $GITHUB_ENV
        
        echo "EC2_SSH_KEY<<EOF" >> $GITHUB_ENV
        terraform output -raw ec2_private_key >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest

    - name: Rollout Application to Live Instance
      if: github.event_name == 'push'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_PUBLIC_IP }}
        username: ubuntu
        key: ${{ env.EC2_SSH_KEY }}
        script: |
          until sudo docker info >/dev/null 2>&1; do echo "Waiting for Docker Engine initialization..."; sleep 5; done
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
          sudo docker stop app-runtime 2>/dev/null || true
          sudo docker rm app-runtime 2>/dev/null || true
          sudo docker run -d --name app-runtime --restart always -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
