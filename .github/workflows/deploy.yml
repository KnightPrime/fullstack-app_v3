name: Complete Zero-Dependency GitOps Pipeline

on:
  pull_request:
    branches: [ Dockerhub, Dockerhub-prod ]
  push:
    branches: [ Dockerhub, Dockerhub-prod ]

jobs:
  # --- NEW: INITIAL AUTOMATED GUARDRAIL JOB (Spins up first) ---
  validate-code-tests:
    uses: ./.github/workflows/test.yml # Local reusable file hook without trailing branch tags

  # --- MODIFIED DEPLOYMENT JOB: Only executes if tests go green ---
  infra-and-deploy:
    needs: validate-code-tests # CRITICAL FENCE: Blocks deployment if code testing fails
    runs-on: ubuntu-latest
    # FIXED: Direct branch-to-environment mapping context parameters
    environment: ${{ github.ref_name == 'Dockerhub' && 'Production' || 'development' }}

    env:
      # CHOOSE A GLOBALLY UNIQUE NAME FOR YOUR TERRAFORM STATE BUCKET
      STATE_BUCKET_NAME: "knightprime-gitops-state-bucket-2026"
      AWS_REGION: "us-east-1"
      # Mapped dynamically: "Dockerhub" branch goes to production, any other goes to staging
      TARGET_ENV: ${{ github.ref_name == 'Dockerhub' && 'Production' || 'development' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- STEP 1: CONFIGURE AWS CLI CREDENTIALS ---
    - name: Configure AWS CLI Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # --- STEP 2: AUTOMATICALLY VERIFY OR CREATE THE S3 STATE BUCKET ---
    - name: Bootstrap S3 State Bucket
      run: |
        echo "Checking if S3 Bucket '${{ env.STATE_BUCKET_NAME }}' exists..."
        if aws s3api head-bucket --bucket "${{ env.STATE_BUCKET_NAME }}" 2>/dev/null; then
          echo "Bucket already exists. Proceeding..."
        else
          echo "Bucket not found. Creating fresh S3 state architecture bucket..."
          aws s3api create-bucket \
            --bucket "${{ env.STATE_BUCKET_NAME }}" \
            --region "${{ env.AWS_REGION }}"
            
          echo "Enabling bucket versioning for safety rollbacks..."
          aws s3api put-bucket-versioning \
            --bucket "${{ env.STATE_BUCKET_NAME }}" \
            --versioning-configuration Status=Enabled
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    # --- STEP 3: DYNAMICALLY INITIALIZE BACKEND USING PARTIAL CONFIGS ---
    - name: Terraform Init (Dynamic S3 Backend Connection)
      working-directory: ./terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ env.STATE_BUCKET_NAME }}" \
          -backend-config="key=state/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

# --- SELECTION OF ISOLATED TERRAFORM WORKSPACE SILOS ---
    - name: Select or Create Environment Workspace Partition
      working-directory: ./terraform
      run: |
        echo "=== Switching to Target Infrastructure Workspace: ${{ env.TARGET_ENV }} ==="
        terraform workspace select ${{ env.TARGET_ENV }} || terraform workspace new ${{ env.TARGET_ENV }}

    # --- STEP 4: DRY RUN PREVIEW ON PR ---
    - name: Terraform Plan (PR Validation)
      if: github.event_name == 'pull_request'
      working-directory: ./terraform
      run: |
        terraform plan \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"

    # --- NEW: PRACTICAL DRIFT AND REBUILD CHECK ---
    - name: Determine If Infrastructure Rebuild Is Required
      id: check-infra
      if: github.event_name == 'push'
      working-directory: ./terraform
      run: |
        # Run plan with detailed exitcode. '|| tr' prevents the script from crashing when changes are found.
        terraform plan -detailed-exitcode -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" > /dev/null 2>&1 && EXIT_CODE=$? || EXIT_CODE=$?
        echo "Terraform Exit Code evaluated to: $EXIT_CODE"
        
        if [ $EXIT_CODE -eq 0 ]; then
          echo "INFRA_CHANGED=false" >> $GITHUB_ENV
          echo "✅ No infrastructure modifications required. Keeping hardware as-is."
        else
          echo "INFRA_CHANGED=true" >> $GITHUB_ENV
          echo "⚠️ Infrastructure drift or structural updates detected. Processing configuration changes..."
        fi

    # --- STEP 5: RUN APPLY ONLY IF STRUCTURAL CHANGES EXIST ---
    - name: Terraform Apply (Conditional Infrastructure Provisioning)
      if: github.event_name == 'push' && env.INFRA_CHANGED == 'true'
      working-directory: ./terraform
      run: |
        terraform workspace select ${{ env.TARGET_ENV }}
        terraform apply -auto-approve \
          -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
          -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          
    # --- STEP 6: ALWAYS EXTRACT NETWORKS FOR THE APPLICATION CONTAINER ---
    - name: Fetch Dynamic Infrastructure Parameters
      if: github.event_name == 'push'
      id: infra-vars
      working-directory: ./terraform
      run: |
        terraform workspace select ${{ env.TARGET_ENV }}
        EC2_IP=$(terraform output -raw app_public_ip)
        echo "EC2_PUBLIC_IP=$EC2_IP" >> $GITHUB_ENV
        
        echo "EC2_SSH_KEY<<EOF" >> $GITHUB_ENV
        terraform output -raw ec2_private_key >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
  # --- HYBRID OPTIMIZATION: SETUP DOCKER BUILDX CAPABILITIES ---
    - name: Set up Docker Buildx
      if: github.event_name == 'push'
      uses: docker/setup-buildx-action@v3
 
 # --- STEP 7: DOCKER HUB REGISTRY AUTHENTICATION ---
    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    #--- STEP 8: SECURE CACHED CONTAINER BUILD WITH PERFECTLY ALIGNED MULTILINE TAGS ---
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:sha-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
# FIXED: Virtual cache registry hooks drop sequential compilation latency below 30    # --- STEP 7: BUILD AND PUSH IMMUTABLE DOCKER IMAGES ---
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-app:sha-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # --- STEP 9: PRODUCTION-GRADE NATIVE ANSIBLE ORCHESTRATION ---
    - name: Install Official Verified Ansible Core
      run: |
        echo "=== Installing official Ansible binary engine natively ==="
        python3 -m pip install --user ansible-core
        echo "=== Installing official verified community Docker collection ==="
        ansible-galaxy collection install community.docker
        
    - name: Generate Local Infrastructure Inventory Map
      run: |
        echo "=== Writing Dynamic Ansible Inventory ==="
        mkdir -p ansible
        echo "[app_servers]" > ansible/inventory.ini
        echo "${{ env.EC2_PUBLIC_IP }} ansible_user=ubuntu" >> ansible/inventory.ini

    - name: Execute Playbook Automation Loop Natively Over SSH
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        ANSIBLE_SSH_KEY: ${{ env.EC2_SSH_KEY }}
      run: |
        echo "$ANSIBLE_SSH_KEY" > /tmp/deploy_key.pem
        chmod 600 /tmp/deploy_key.pem
        
        ansible-playbook ansible/playbook.yml \
          -i ansible/inventory.ini \
          --private-key=/tmp/deploy_key.pem \
          --ssh-common-args='-o StrictHostKeyChecking=no'
          
        rm -f /tmp/deploy_key.pem

  # --- LOCAL LINKED DOWNSTREAM VERIFICATION COMPONENT ---
  trigger-verification:
    needs: infra-and-deploy
    uses: ./.github/workflows/verify.yml
    with:
      target_ip: ${{ needs.infra-and-deploy.outputs.ec2_public_ip }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
          
